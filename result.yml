openapi: 3.0.0
info:
  title: Nistrax API Swagger
  description: Nistrax API documentation
  version: '1.0'
  x-logo:
    url: https://github.com/joolfe/logoBanner.png
    backgroundColor: '#FFFFFF'
    altText: logo
  termsOfService: '#'
  contact:
    name: Mero Vision
    url: https://merovision.com
    email: merovision720@gmail.com
  license:
    name: MIT
    url: https://es.wikipedia.org/wiki/Licencia_MIT
servers:
  - url: https://nistrax-api.merovision.com
    description: server
components:
  securitySchemes:
    noauthAuth:
      type: http
      scheme: noauth
    bearerAuth:
      type: http
      scheme: bearer
tags:
  - name: Superadmin
  - name: Superadmin > Auth
  - name: Superadmin > User
  - name: Superadmin > Company
  - name: Superadmin > Tenant/Company User
  - name: Superadmin > Payment Method
  - name: Superadmin > Tenant Payment Method
  - name: Admin
  - name: Admin > Auth
  - name: Admin > Category
  - name: Admin > Products
  - name: Admin > Branches
  - name: Admin > Payment Method
paths:
  /api/v1/superadmin/auth/login:
    post:
      tags:
        - Superadmin > Auth
      summary: login
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: superadmin@nistrax.com
                password:
                  type: string
                  example: password
      security:
        - noauthAuth: []
      parameters:
        - name: Accept
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/v1/superadmin/auth/logout:
