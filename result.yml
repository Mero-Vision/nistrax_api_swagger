  /api/v1/admin/purchase-returns:
    get:
      tags:
        - Admin > Purchase Return
      summary: show all purchase return data
      security:
        - bearerAuth: []
      parameters:
        - name: Accept
          in: header
          schema:
            type: string
          example: application/json
        - name: X-Tenant
          in: header
          schema:
            type: string
          example: nistrax
        - name: x-branch-id
          in: header
          schema:
            type: integer
          example: '1'
        - name: status
          in: query
          schema:
            type: string
          example: completed
        - name: supplier_id
          in: query
          schema:
            type: integer
          example: '1'
        - name: search
          in: query
          schema:
            type: string
          example: PR-000
        - name: date_from
          in: query
          schema:
            type: string
          example: '2026-08-01'
        - name: date_to
          in: query
          schema:
            type: string
          example: '2026-08-31'
        - name: pagination_limit
          in: query
          schema:
            type: integer
          example: '15'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      tags:
        - Admin > Purchase Return
      summary: store purchase return data
      description: >-
        Notes:


        purchase_order_id is the PO's UUID — the PO must be received or
        partially_received (⚠️ 422 otherwise).

        items[].purchase_order_item_id = the purchase_order_item id (same ids
        used in /purchase-orders/{id}/receive), not product_id.

        quantity can't exceed that line's quantity_received minus anything
        already returned in a completed return (⚠️ 422 "Cannot return X units...
        Max returnable: Y.").

        warehouse_id optional — defaults to the PO item's warehouse; stock is
        deducted from there if inventory exists for that product/variant/batch
        combo.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                purchase_order_id: 0198e2b1-1234-7abc-8def-000000000000
                return_date: '2026-08-05'
                note: Damaged units found on inspection
                items:
                  - purchase_order_item_id: 15
                    quantity: 2
                    warehouse_id: 1
                  - purchase_order_item_id: 16
                    quantity: 1
                    warehouse_id: 1
      security:
        - bearerAuth: []
      parameters:
        - name: Accept
          in: header
          schema:
            type: string
          example: application/json
        - name: X-Tenant
          in: header
          schema:
            type: string
          example: nistrax
        - name: x-branch-id
          in: header
          schema:
            type: integer
          example: '1'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
