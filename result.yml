  /api/v1/admin/purchase-returns/{purchase_return_id}/cancel:
    get:
      tags:
        - Admin > Purchase Return
      summary: cancel purchase return
      description: >-
        Reverses the return — adds the returned stock back and sets status:
        "cancelled". ⚠️ 422 "Purchase return is already cancelled." if already
        cancelled.
      security:
        - bearerAuth: []
      parameters:
        - name: Accept
          in: header
