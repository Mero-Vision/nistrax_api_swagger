  /api/v1/superadmin/tenants/{tenantid}/payment-methods:
    post:
      tags:
        - Superadmin > Tenant Payment Method
      summary: store tenant payment method
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example: |-
                Body (eSewa):
                {
                  "payment_method_id": 1,
                  "is_active": true,
                  "sort_order": 1,
                  "credentials": {
                    "merchant_id": "your-merchant-id",
                    "secret_key": "your-secret-key"
                  }
                }

                Body (Khalti):
                {
                  "payment_method_id": 2,
                  "is_active": true,
                  "sort_order": 2,
                  "credentials": {
                    "public_key": "your-public-key",
                    "secret_key": "your-secret-key"
                  }
                }

                Body (FonePay):
                {
                  "payment_method_id": 3,
                  "is_active": true,
                  "sort_order": 3,
                  "credentials": {
                    "merchant_code": "your-merchant-code",
                    "secret_key": "your-secret-key"
                  }
                }

                Body (Bank Transfer):
                {
                  "payment_method_id": 4,
                  "is_active": true,
                  "sort_order": 4,
                  "credentials": {
                    "bank_name": "Nepal Investment Bank",
                    "account_name": "Company Name Pvt. Ltd.",
                    "account_number": "0123456789",
                    "branch": "Kathmandu"
                  }
                }

                Body (Cash):
                {
                  "payment_method_id": 5,
                  "is_active": true,
                  "sort_order": 5,
                  "credentials": null
                }
      security:
        - bearerAuth: []
      parameters:
        - name: Accept
          in: header
          schema:
            type: string
          example: application/json
        - name: X-Tenant
          in: header
          schema:
            type: string
          example: nistrax
        - name: x-branch-id
          in: header
          schema:
            type: integer
          example: '1'
        - name: tenantid
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
