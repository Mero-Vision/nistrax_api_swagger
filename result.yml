            type: string
          example: application/json
        - name: X-Tenant
          in: header
          schema:
            type: string
          example: nistrax
        - name: x-branch-id
          in: header
          schema:
            type: integer
          example: '1'
        - name: purchase_return_id
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/v1/admin/sale-returns:
    get:
      tags:
        - Admin > Sales Return
      summary: store sales return data
      description: >-
        Notes:


        refund_type must be one of cash_refund | store_credit | exchange.

        order_id must belong to an order that's confirmed, paid, completed,
        partially_refunded, or refunded (⚠️ 422 otherwise).

        items[].order_item_id = the order_item id, not product_id.

        quantity can't exceed that line's ordered quantity minus anything
        already returned in a completed return (⚠️ 422 "Cannot return X units...
        Max returnable: Y.").

        warehouse_id optional — defaults to the order item's warehouse; stock is
        restocked there if provided (unlike purchase returns, this doesn't
        require existing inventory rows — it always adds stock when a warehouse
        is resolved).

        On success this also updates the parent order's payment_status/status to
        refunded or partially_refunded and writes a refund OrderPayment record.
      security:
        - bearerAuth: []
      parameters:
        - name: Accept
          in: header
          schema:
            type: string
          example: application/json
        - name: X-Tenant
          in: header
          schema:
            type: string
          example: nistrax
        - name: x-branch-id
          in: header
          schema:
            type: integer
          example: '1'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
